[Metadata]
Name=Weather
Author=jcode
Information=Outside conditions for the configured location. The third card in the set with GreeAC and SensiboAir, styled to match. Data file is written by the gree-ac toolkit (logs\weather_status.txt) from Open-Meteo, medianed across three models so the dew point agrees with MouldGuard.
Version=1.0

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; RunCommand does not fire on its own: kicked here on load and by [mPoll].
OnRefreshAction=[!ZPos -2][!CommandMeasure mFetch Run]
ContextTitle=Refresh now
ContextAction=[!CommandMeasure cmdForce Run]
ContextTitle2=Open toolkit folder
ContextAction2=["#ToolsRoot#\gree-ac"]

[Variables]
; Same palette and type scale as the Sensibo Air and Gree AC cards.
Face=Segoe UI
SizeLabel=9
SizeBig=26
ColorLabel=140,140,145,255
ColorValue=232,232,236,255
ColorGood=255,255,255,255
ColorElevated=235,170,60,255
ColorBad=255,107,107,255
Pad=14
ToolsRoot=C:\Tools
W=244
Venv=#ToolsRoot#\gree-ac\venv\Scripts\python.exe
Script=#ToolsRoot#\gree-ac\weather_status.py
FileURL=file:///#ToolsRoot#/gree-ac/logs/weather_status.txt

; ---------------------------------------------------------------------------
; The data file is one pipe-separated line, always the same fields in the same
; order, so this pattern cannot drift:
;   temp|feels|rh|dew|wind|gust|precip|pop|hi|lo|rain_today|condition|written|stale|error
; test_weather_status.py asserts this order still matches the writer's FIELDS.
; ---------------------------------------------------------------------------

; Fetch: runs the writer, which fetches Open-Meteo and rewrites the file itself.
; No OutputFile here: the script owns the file, see the GreeAC notes in the README.
[mFetch]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# --max-age 120
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!UpdateMeasureGroup Vals][!UpdateMeterGroup V][!Redraw]

; Periodic kick. weather_status.py self-throttles (300 s), so this stays cheap.
[mPoll]
Measure=Calc
Formula=1
DynamicVariables=1
UpdateDivider=60
OnUpdateAction=[!CommandMeasure mFetch Run]

[mFile]
Measure=Plugin
Plugin=WebParser
URL=#FileURL#
UpdateRate=30
RegExp=(?siU)temp=(.*)\|feels=(.*)\|rh=(.*)\|dew=(.*)\|wind=(.*)\|gust=(.*)\|precip=(.*)\|pop=(.*)\|hi=(.*)\|lo=(.*)\|rain_today=(.*)\|condition=(.*)\|pollen=(.*)\|written=(.*)\|stale=(.*)\|error=(.*)
FinishAction=[!UpdateMeasureGroup Vals][!UpdateMeterGroup V][!Redraw]
OnRegExpErrorAction=[!SetOption MeterTitle Text "WEATHER  no data"][!UpdateMeter MeterTitle][!Redraw]

[mTemp]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=1
Group=Vals
Substitute="":"--"

[mFeels]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=2
Group=Vals
Substitute="":"--"

[mRh]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=3
Group=Vals
Substitute="":"--"

[mDew]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=4
Group=Vals
Substitute="":"--"

[mWind]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=5
Group=Vals
Substitute="":"--"

[mGust]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=6
Group=Vals
Substitute="":"--"

[mPrecip]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=7
Group=Vals
Substitute="":"--"

[mPop]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=8
Group=Vals
Substitute="":"--"

[mHi]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=9
Group=Vals
Substitute="":"--"

[mLo]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=10
Group=Vals
Substitute="":"--"

[mRainToday]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=11
Group=Vals
Substitute="":"--"

[mCondition]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=12
Group=Vals
Substitute="":"unknown"

[mWritten]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=14
Group=Vals
Substitute="":"--"

[mStale]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=15
Group=Vals

[mError]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=16
Group=Vals

; Numeric twins (no cosmetic substitution) so the band ladders can compare them.
[mDewRaw]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=4
Group=Vals

[mPopRaw]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=8
Group=Vals

; ---------------------------------------------------------------------------
; Band colouring. White is "fine", amber is "worth noticing", red is "act".
; The dew-point bounds are MouldGuard's own vent_good_dew (12C) and
; vent_marginal_dew (14.5C): below 12 is dry enough to purge the house, above
; the top bound is too wet to open up.
; ---------------------------------------------------------------------------
[mDewTone]
Measure=Calc
Formula=mDewRaw
DynamicVariables=1
IfCondition=mDewRaw < 12
IfTrueAction=[!SetOption MeterDewValue FontColor "#ColorGood#"][!UpdateMeter MeterDewValue][!Redraw]
IfCondition2=(mDewRaw >= 12) && (mDewRaw < 14.5)
IfTrueAction2=[!SetOption MeterDewValue FontColor "#ColorElevated#"][!UpdateMeter MeterDewValue][!Redraw]
IfCondition3=mDewRaw >= 14.5
IfTrueAction3=[!SetOption MeterDewValue FontColor "#ColorBad#"][!UpdateMeter MeterDewValue][!Redraw]

; Rain chance (%): <30 fine, 30-69 worth the umbrella, 70+ expect rain.
[mPopTone]
Measure=Calc
Formula=mPopRaw
DynamicVariables=1
IfCondition=mPopRaw < 30
IfTrueAction=[!SetOption MeterPop FontColor "#ColorGood#"][!UpdateMeter MeterPop][!Redraw]
IfCondition2=(mPopRaw >= 30) && (mPopRaw < 70)
IfTrueAction2=[!SetOption MeterPop FontColor "#ColorElevated#"][!UpdateMeter MeterPop][!Redraw]
IfCondition3=mPopRaw >= 70
IfTrueAction3=[!SetOption MeterPop FontColor "#ColorBad#"][!UpdateMeter MeterPop][!Redraw]

[mStaleTone]
Measure=Calc
Formula=mStale
IfCondition=mStale = 1
IfTrueAction=[!ShowMeter MeterStale]
IfFalseAction=[!HideMeter MeterStale]
DynamicVariables=1

; ---------------------------------------------------------------------------
; Meters
; ---------------------------------------------------------------------------
[MeterBack]
Meter=Image
SolidColor=16,16,18,205
W=#W#
H=186
X=0
Y=0
LeftMouseUpAction=[!CommandMeasure cmdForce Run]
MouseActionCursor=0

[MeterAccent]
Meter=Image
SolidColor=#ColorGood#
W=3
H=186
X=0
Y=0

[MeterTitle]
Meter=String
MeterStyle=StyleLabel
X=#Pad#
Y=10
Text="WEATHER"
FontSize=10
FontColor=#ColorValue#
FontWeight=600
AntiAlias=1
DynamicVariables=1

[MeterCondition]
Meter=String
MeterStyle=StyleLabel
X=(#W#-#Pad#)
Y=10
StringAlign=Right
FontSize=10
StringCase=Upper
FontColor=#ColorValue#
Text="[mCondition]"
AntiAlias=1
DynamicVariables=1

[MeterStale]
Meter=String
MeterStyle=StyleLabel
X=(#W#-#Pad#)
Y=30
StringAlign=Right
FontSize=9
FontColor=#ColorBad#
Text="OFFLINE"
DynamicVariables=1
Hidden=1

[MeterTemp]
Meter=String
FontFace=#Face#
FontSize=#SizeBig#
FontColor=#ColorValue#
StringStyle=Bold
X=#Pad#
Y=28
Text="[mTemp]   C"
AntiAlias=1
DynamicVariables=1

; Feels-like on the left, humidity on the right: one row, plain white.
[MeterFeels]
Meter=String
MeterStyle=StyleLabel
X=#Pad#
Y=74
FontSize=10
FontColor=#ColorValue#
Text="feels [mFeels]"
DynamicVariables=1

[MeterRhRow]
Meter=String
MeterStyle=StyleLabel
X=(#W#-#Pad#)
Y=74
StringAlign=Right
FontSize=10
FontColor=#ColorValue#
Text="humidity [mRh] %"
DynamicVariables=1

[MeterRule]
Meter=Image
SolidColor=60,60,64,255
W=(#W#-#Pad#*2)
H=1
X=#Pad#
Y=96

; Dew point: only the number takes the band colour.
[MeterDewLabel]
Meter=String
MeterStyle=StyleLabel
X=#Pad#
Y=106
W=54
FontColor=#ColorValue#
Text="DEW POINT"

[MeterDewValue]
Meter=String
MeterStyle=StyleLabel
X=84
Y=106
FontColor=#ColorGood#
Text="[mDew]"
DynamicVariables=1

[MeterDewUnit]
Meter=String
MeterStyle=StyleLabel
X=4R
Y=106
FontColor=#ColorValue#
Text="C"

; Rain chance: the percentage carries the band colour, the rest stays white.
[MeterRainLabel]
Meter=String
MeterStyle=StyleLabel
X=#Pad#
Y=124
W=54
FontColor=#ColorValue#
Text="RAIN"

[MeterPop]
Meter=String
MeterStyle=StyleLabel
X=84
Y=124
FontColor=#ColorGood#
Text="[mPop]"
DynamicVariables=1

[MeterPopUnit]
Meter=String
MeterStyle=StyleLabel
X=4R
Y=124
FontColor=#ColorValue#
Text="%"

[MeterPrecip]
Meter=String
MeterStyle=StyleLabel
X=6R
Y=124
FontColor=#ColorValue#
Text=" now [mPrecip] mm"
DynamicVariables=1

[MeterTodayLabel]
Meter=String
MeterStyle=StyleLabel
X=#Pad#
Y=142
W=54
FontColor=#ColorValue#
Text="TODAY"

[MeterTodayValue]
Meter=String
MeterStyle=StyleLabel
X=84
Y=142
FontColor=#ColorValue#
Text="[mLo] / [mHi] C"
DynamicVariables=1

; Today's rain total, right-aligned so the left column can stay narrow.
[MeterRainToday]
Meter=String
MeterStyle=StyleLabel
X=(#W#-#Pad#)
Y=142
StringAlign=Right
FontColor=#ColorValue#
Text="[mRainToday] mm"
DynamicVariables=1

[MeterWindLabel]
Meter=String
MeterStyle=StyleLabel
X=#Pad#
Y=160
W=54
FontColor=#ColorValue#
Text="WIND"

[MeterWindValue]
Meter=String
MeterStyle=StyleLabel
X=84
Y=160
FontColor=#ColorValue#
Text="[mWind] km/h"
DynamicVariables=1

; Gusts, right-aligned on the wind row.
[StyleLabel]
FontFace=#Face#
FontSize=#SizeLabel#
FontColor=#ColorLabel#
AntiAlias=1

; --- condition-driven palette ----------------------------------------------
; WMO words from weather_status.py: Clear / Mainly clear / Partly cloudy /
; Overcast / Fog / Rime fog / drizzle / rain / showers / snow / thunderstorm.
; The accent, panel tint, temperature, condition word and rule all follow it,
; so the card reads at a glance instead of staying sterile white.
[mConditionTone]
Measure=String
String=[mCondition]
DynamicVariables=1
IfMatch=.*(thunder|storm).*
IfMatchAction=[!SetOption MeterAccent SolidColor "195,150,255,255"][!SetOption MeterTemp FontColor "195,150,255,255"][!SetOption MeterCondition FontColor "195,150,255,255"][!UpdateMeter MeterAccent][!UpdateMeter MeterTemp][!UpdateMeter MeterCondition][!Redraw]
IfMatch2=.*(snow|sleet|ice|freezing).*
IfMatchAction2=[!SetOption MeterAccent SolidColor "165,225,245,255"][!SetOption MeterTemp FontColor "165,225,245,255"][!SetOption MeterCondition FontColor "165,225,245,255"][!UpdateMeter MeterAccent][!UpdateMeter MeterTemp][!UpdateMeter MeterCondition][!Redraw]
IfMatch3=.*(rain|drizzle|shower).*
IfMatchAction3=[!SetOption MeterAccent SolidColor "95,175,255,255"][!SetOption MeterTemp FontColor "95,175,255,255"][!SetOption MeterCondition FontColor "95,175,255,255"][!UpdateMeter MeterAccent][!UpdateMeter MeterTemp][!UpdateMeter MeterCondition][!Redraw]
IfMatch4=.*(fog|mist|haze).*
IfMatchAction4=[!SetOption MeterAccent SolidColor "170,175,180,255"][!SetOption MeterTemp FontColor "170,175,180,255"][!SetOption MeterCondition FontColor "170,175,180,255"][!UpdateMeter MeterAccent][!UpdateMeter MeterTemp][!UpdateMeter MeterCondition][!Redraw]
IfMatch5=.*(cloud|overcast).*
IfMatchAction5=[!SetOption MeterAccent SolidColor "165,180,195,255"][!SetOption MeterTemp FontColor "165,180,195,255"][!SetOption MeterCondition FontColor "165,180,195,255"][!UpdateMeter MeterAccent][!UpdateMeter MeterTemp][!UpdateMeter MeterCondition][!Redraw]
IfMatch6=.*(clear|sun).*
IfMatchAction6=[!SetOption MeterAccent SolidColor "255,200,90,255"][!SetOption MeterTemp FontColor "255,200,90,255"][!SetOption MeterCondition FontColor "255,200,90,255"][!UpdateMeter MeterAccent][!UpdateMeter MeterTemp][!UpdateMeter MeterCondition][!Redraw]
IfMatch7=^$
IfMatchAction7=[!SetOption MeterAccent SolidColor "140,140,145,255"][!SetOption MeterTemp FontColor "140,140,145,255"][!SetOption MeterCondition FontColor "140,140,145,255"][!UpdateMeter MeterAccent][!UpdateMeter MeterTemp][!UpdateMeter MeterCondition][!Redraw]

; Left-click / context refresh bypasses the two-minute throttle.
[cmdForce]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# --max-age 0
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]


; --- pollen ---------------------------------------------------------------
; Grass pollen is reported as Low / Moderate / High / Very High / n/a.
[mPollen]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=13
Group=Vals
Substitute="":"n/a"

[mPollenTone]
Measure=String
String=[mPollen]
DynamicVariables=1
IfMatch=^Low$
IfMatchAction=[!SetOption MeterPollen FontColor "110,220,140,255"][!UpdateMeter MeterPollen][!Redraw]
IfMatch2=^Moderate$
IfMatchAction2=[!SetOption MeterPollen FontColor "235,170,60,255"][!UpdateMeter MeterPollen][!Redraw]
IfMatch3=^High$
IfMatchAction3=[!SetOption MeterPollen FontColor "255,107,107,255"][!UpdateMeter MeterPollen][!Redraw]
IfMatch4=^Very High$
IfMatchAction4=[!SetOption MeterPollen FontColor "195,150,255,255"][!UpdateMeter MeterPollen][!Redraw]
IfMatch5=^n/a$
IfMatchAction5=[!SetOption MeterPollen FontColor "140,140,145,255"][!UpdateMeter MeterPollen][!Redraw]

[MeterPollen]
Meter=String
MeterStyle=StyleLabel
X=(#W#-#Pad#)
Y=160
StringAlign=Right
FontColor=#ColorLabel#
Text="pollen [mPollen]"
ToolTipText="Grass pollen for your location, modelled by SkyPollen (cached 3 h)"
DynamicVariables=1
